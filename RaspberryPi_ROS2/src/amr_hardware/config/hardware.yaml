# Real-robot driver parameters (Raspberry Pi 5), loaded by hardware.launch.py.
# Values marked MEASURE must be checked on the physical robot.
# Setup and wiring: docs/hardware.md.

# ── RPLidar A1M8 x2 (rplidar_ros) ───────────────────────────────────────
# ttyUSB numbering depends on plug-in order: pin the ports with
# /dev/serial/by-path/... or udev symlinks (docs/hardware.md).
/front_lidar/rplidar:
  ros__parameters:
    serial_port: /dev/ttyUSB0
    serial_baudrate: 115200        # A1M8
    frame_id: laser_frame          # front lidar link in the URDF
    angle_compensate: true
    inverted: false                # true if the lidar is mounted upside down
    flip_x_axis: false             # true if the scan shows up rotated 180 deg in RViz

/rear_lidar/rplidar:
  ros__parameters:
    serial_port: /dev/ttyUSB1
    serial_baudrate: 115200
    frame_id: laser_rear_frame     # rear lidar link in the URDF
    angle_compensate: true
    inverted: false
    flip_x_axis: false

# ── MPU9250 on the Pi 5 I2C header (SDA pin 3, SCL pin 5) ──────────────
mpu9250:
  ros__parameters:
    i2c_bus: 1
    i2c_address: 104               # 0x68 (AD0 low); use 105 = 0x69 if AD0 is high
    frame_id: imu_link
    rate: 100.0
    accel_range_g: 4               # 2 / 4 / 8 / 16
    gyro_range_dps: 500            # 250 / 500 / 1000 / 2000
    gyro_calibration_samples: 200  # keep the robot still for ~2 s at start-up
    linear_acceleration_stddev: 0.05
    angular_velocity_stddev: 0.005
    magnetic_field_stddev: 1.0e-6

# ── Orientation filter: imu/data_raw (+ imu/mag) -> imu/data ───────────
imu_filter:
  ros__parameters:
    use_mag: false                 # enable only after a hard-iron calibration (mag_bias_*)
    publish_tf: false              # the EKF owns odom -> base_footprint
    world_frame: enu
    gain: 0.1
    orientation_stddev: 0.05
    mag_bias_x: 0.0                # [T]
    mag_bias_y: 0.0
    mag_bias_z: 0.0

# ── CAN bridge: hoverboard drive board + STM32F411 e-stop controller ───
can_bridge:
  ros__parameters:
    can_interface: can0
    board_id: 1                    # CAN_NODE_ID of the hoverboard board
    wheel_radius: 0.0825           # MEASURE [m] (6.5" hoverboard hub motor)
    wheel_separation: 0.55         # MEASURE left-to-right wheel contact distance [m]
    ticks_per_revolution: 90.0     # hall steps per wheel revolution (15 pole pairs x 6)
    max_wheel_rpm: 150.0           # software limit (~1.3 m/s), well below the firmware N_MOT_MAX (1000)
    cmd_vel_timeout: 0.5           # [s] without cmd_vel -> wheels commanded to 0 rpm
    status_timeout: 0.5            # [s] without a status frame -> board reported offline
    rate: 50.0                     # [Hz] wheel commands + odometry
    status_rate: 10.0              # [Hz] hoverboard/status and estop/status
    odom_frame: odom
    base_frame: base_footprint
