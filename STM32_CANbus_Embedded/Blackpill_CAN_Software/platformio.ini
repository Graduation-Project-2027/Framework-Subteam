; AMR body controller (BODY node): WeAct Blackpill STM32F411CEU6 + MCP2515 CAN controller.
; Build/upload from VS Code (PlatformIO) or with "Blackpill Tool.bat" (build, SWD/DFU upload, serial terminal).

[platformio]
default_envs = blackpill

[env:blackpill]
platform = ststm32
board = blackpill_f411ce
framework = arduino
upload_protocol = stlink            ; SWD with an ST-Link (SWDIO, SWCLK, GND, 3V3)
debug_tool = stlink
monitor_speed = 115200
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_VID=0x0483
    -D USBD_PID=0x5740
    '-D USB_MANUFACTURER_STRING="E-JUST AMR"'
    '-D USB_PRODUCT_STRING="AMR Body Controller"'
    ; CAN bus (also set from the Blackpill Tool). All nodes on the bus must use the same bitrate.
    -D CAN_BITRATE=1000000
    -D MCP2515_CRYSTAL_HZ=16000000
build_src_flags = -Wall -Wextra

; Same firmware, uploaded over USB with the STM32 system bootloader (DFU).
; Enter DFU: hold BOOT0, tap NRST, release BOOT0 (or type "dfu" in the serial terminal).
[env:blackpill_dfu]
extends = env:blackpill
upload_protocol = dfu
